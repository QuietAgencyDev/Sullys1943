# Quiet Agency · Sullys1943 API on Railway (monorepo root)
# Matches apps/api/railway.toml — keep both in sync.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build -w @sullys/api"

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/api/v1/health"
restartPolicyType = "ON_FAILURE"
