<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sullys Coach 2</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c1c1c;
        color: #f4f0ea;
        font-family: Georgia, "Times New Roman", serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      .stage {
        width: min(92vw, 640px);
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .ring {
        width: min(92vw, 640px);
        aspect-ratio: 599 / 801;
        position: relative;
        overflow: hidden;
        background: #2a2a2a;
        border-radius: 8px;
      }
      .fighter {
        position: absolute;
        inset: 0;
        animation: bounce 3s ease-in-out infinite;
      }
      .fighter img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }
      .torso {
        left: -0.45%;
        top: 0.5%;
        transform: scale(0.968);
        transform-origin: 50% 24%;
        z-index: 9;
      }
      .neck {
        left: -0.45%;
        top: 0.5%;
        transform: scale(0.968);
        transform-origin: 50% 24%;
        z-index: 8;
      }
      .upperarm-r { left: 1.6%; top: -2.4%; z-index: 10; }
      .upperarm-l { left: -1.8%; top: -1.2%; z-index: 11; }
      .forearm-r {
        left: 1.6%;
        top: -2.4%;
        transform-origin: 31.4% 32.5%;
        z-index: 12;
        animation: jab-arm-r 3s ease-in-out infinite;
      }
      .forearm-l {
        left: -1.8%;
        top: -1.2%;
        transform-origin: 64.8% 33.1%;
        z-index: 13;
        animation: jab-arm-l 3s ease-in-out infinite;
      }
      .shoe-r { top: 1.7%; z-index: 1; }
      .shoe-l { left: -0.4%; top: 2.1%; z-index: 4; }
      .shin-r { top: -0.37%; z-index: 2; }
      .thigh-r { z-index: 3; }
      .shin-l { top: -0.37%; z-index: 5; }
      .pelvis { z-index: 6; }
      .thigh-l { z-index: 7; }
      .head {
        transform-origin: 50% 24%;
        animation: nod 3s ease-in-out infinite;
        z-index: 14;
      }
      .glove-r {
        left: 4.6%;
        top: -3.6%;
        transform-origin: 33.72% 28.71%;
        animation: punch-r 3s ease-in-out infinite;
        z-index: 15;
      }
      .glove-l {
        left: -5.5%;
        top: -2.1%;
        transform-origin: 60.77% 30.09%;
        animation: punch-l 3s ease-in-out infinite;
        z-index: 16;
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        16.6%,
        50%,
        83.3% {
          transform: translateY(14px);
        }
        33.3%,
        66.6% {
          transform: translateY(0);
        }
      }
      @keyframes nod {
        0%,
        33%,
        68%,
        100% {
          transform: translateX(2.2%) scale(1.15) rotate(0deg);
        }
        44% {
          transform: translateX(2.2%) scale(1.15) rotate(5deg);
        }
        55% {
          transform: translateX(2.2%) scale(1.15) rotate(-5deg);
        }
      }
      @keyframes jab-arm-r {
        0%,
        12%,
        28%,
        76%,
        94%,
        100% {
          transform: translate(0, 0) scale(1.06);
        }
        16% {
          transform: translate(-8px, -12px) scale(1.06);
        }
        84% {
          transform: translate(-5px, -7px) scale(1.06);
        }
      }
      @keyframes jab-arm-l {
        0%,
        40%,
        64%,
        100% {
          transform: translate(0, 0) scale(1.06);
        }
        50% {
          transform: translate(8px, -11px) scale(1.06);
        }
      }
      @keyframes punch-r {
        0%,
        12%,
        28%,
        76%,
        94%,
        100% {
          transform: translate(0, 0) scale(1.16) rotate(0deg);
        }
        16% {
          transform: translate(-8px, -12px) scale(1.19) rotate(3deg);
        }
        84% {
          transform: translate(-5px, -7px) scale(1.18) rotate(2deg);
        }
      }
      @keyframes punch-l {
        0%,
        40%,
        64%,
        100% {
          transform: translate(0, 0) scale(1.06) rotate(0deg);
        }
        50% {
          transform: translate(8px, -11px) scale(1.09) rotate(-3deg);
        }
      }
      .meta {
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="meta">Sullys Coach 2</div>
      <div class="ring">
        <div class="fighter">
          <img class="shoe-r" src="./characters/coach-2/03_Aligned_599x801/shoe_R.png" alt="" />
          <img class="shoe-l" src="./characters/coach-2/03_Aligned_599x801/shoe_L.png" alt="" />
          <img class="shin-r" src="./characters/coach-2/03_Aligned_599x801/shin_R.png" alt="" />
          <img class="shin-l" src="./characters/coach-2/03_Aligned_599x801/shin_L.png" alt="" />
          <img class="pelvis" src="./characters/coach-2/03_Aligned_599x801/pelvis.png" alt="" />
          <img class="thigh-r" src="./characters/coach-2/03_Aligned_599x801/thigh_R.png" alt="" />
          <img class="thigh-l" src="./characters/coach-2/03_Aligned_599x801/thigh_L.png" alt="" />
          <img class="upperarm-r" src="./characters/coach-2/03_Aligned_599x801/upperarm_R.png" alt="" />
          <img class="neck" src="./characters/coach-2/03_Aligned_599x801/neck.png" alt="" />
          <img class="torso" src="./characters/coach-2/03_Aligned_599x801/torso.png" alt="" />
          <img class="upperarm-l" src="./characters/coach-2/03_Aligned_599x801/upperarm_L.png" alt="" />
          <img class="forearm-r" src="./characters/coach-2/03_Aligned_599x801/forearm_R.png" alt="" />
          <img class="forearm-l" src="./characters/coach-2/03_Aligned_599x801/forearm_L.png" alt="" />
          <img class="head" src="./characters/coach-2/03_Aligned_599x801/head.png" alt="" />
          <img class="glove-r" src="./characters/coach-2/03_Aligned_599x801/glove_R.png" alt="" />
          <img class="glove-l" src="./characters/coach-2/03_Aligned_599x801/glove_L.png" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
