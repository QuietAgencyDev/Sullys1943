# Prefer repo-root railway.toml for monorepo deploys.
# If Railway Root Directory is set to apps/api, this file is used instead.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate --schema=./prisma/schema.prisma && npm run build"

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/api/v1/health"
restartPolicyType = "ON_FAILURE"
