# Railway picks this up for the @sullys/api service but builds from the monorepo root.
# Paths are therefore repo-root relative (apps/api/...), not service-root relative.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build -w @sullys/api"

[deploy]
startCommand = "node apps/api/dist/main.js"
healthcheckPath = "/api/v1/health"
restartPolicyType = "ON_FAILURE"
